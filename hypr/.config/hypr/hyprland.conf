# -*- conf -*

# --- Monitor ---
# Configuration for your primary monitor DP-2
monitor=DP-2,3440x1440@144,0x0,1

# --- NVIDIA Settings (Optimized for RTX 4080) ---
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = __GL_GSYNC_ALLOWED,0
env = __GL_VR_ALLOWED,0

# Cursor settings (New recommended syntax)
cursor {
    no_hardware_cursors = true
}
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,28

# --- Auto-start Applications ---
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar &
exec-once = mako &
exec-once = hyprpaper &
exec-once = hyprsunset &
exec-once = openrgb -p gg
exec-once = hyprpm reload -n

# --- Input Configuration ---
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0 
    accel_profile = adaptive
}

master{

    new_on_top = true

  }

# --- General Look and Feel ---
general {
    gaps_in = 3
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(ca9ee6ff) rgba(f2d5cfff) 45deg
    col.inactive_border = rgba(b4befecc) rgba(6c7086cc) 45deg
    layout = dwindle
    resize_on_border = true
}

group {
    col.border_active = rgba(ca9ee6ff) rgba(f2d5cfff) 45deg
    col.border_inactive = rgba(b4befecc) rgba(6c7086cc) 45deg
    col.border_locked_active = rgba(ca9ee6ff) rgba(f2d5cfff) 45deg
    col.border_locked_inactive = rgba(b4befecc) rgba(6c7086cc) 45deg
}

# --- Decoration and Global Blur ---
decoration {
    rounding = 10
    active_opacity = 0.8   # Provides the base transparency for blur
    inactive_opacity = 0.7

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        noise = 0.01
        contrast = 1.2
        brightness = 1.1
        vibrancy = 0.3
    }
}

misc {

    always_follow_on_dnd = true

  }

# --- Layer Rules (Wofi and Menus) ---
layerrule = blur on, match:namespace ^(wofi)$
layerrule = ignore_alpha 0.5, match:namespace ^(wofi)$
layerrule = animation layersIn, match:namespace ^(wofi)$
layerrule = animation layersOut, match:namespace ^(wofi)$


# --- Window Rules (Improved Version) ---

# --- Window Rules (Sintaxis Correcta para Versiones Recientes) ---

windowrule {
  name = move-kitty
  match:class = kitty

  move = 100 100
  animation = popin
}
windowrule {
  name = emulator-float
  match:class = ^(Emulator)$
  float = true
  center = true
}

# MASTER RULE (Optional): 
# Uncomment below if you want EVERYTHING with transparency to have blur automatically:
# windowrulev2 = blur, class:.*

# --- Animations ---
animations {
    enabled = yes
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, once
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}

# --- Layouts ---
dwindle {
    force_split = 0
}

# --- ScrollOverview Plugin ---
plugin {
    scrolloverview {
        gesture_distance = 300
        scale = 0.5
        workspace_gap = 100
        layout = vertical
    }
}

# --- Keybindings ---
$mainMod = SUPER 

bind = $mainMod, RETURN, exec, kitty
bind = $mainMod SHIFT, C, killactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, E, exec, wofi --show drun 

# Focus and Movement
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Apps and Utilities
bind = $mainMod, B, exec, brave 
bind = , PRINT, exec, hyprshot -m region
# --- Window Management ---
bind = $mainMod, F, togglefloating,         # Toggle focused window between floating and tiled
bind = $mainMod, TAB, scrolloverview:overview, toggle
bindm = $mainMod, mouse:272, movewindow     # Drag floating window with SUPER + Left Click
bindm = $mainMod, mouse:273, resizewindow   # Resize floating window with SUPER + Right Click
