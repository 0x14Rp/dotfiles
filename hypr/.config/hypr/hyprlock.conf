# hyprlock — pantalla de bloqueo para niri
# Probar SIN riesgo:  hyprlock --grace 5
# (durante los primeros 5s cualquier tecla desbloquea sin contrasena)

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, easeOut
    animation = inputFieldDots, 1, 1.5, easeOut
}

background {
    monitor =
    path = /home/lucky/Pictures/ix.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
    contrast = 1.0
    vibrancy = 0.15
}

# ---- Reloj -----------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_family = JetBrainsMono Nerd Font
    font_size = 110
    color = rgba(255, 255, 255, 0.95)
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    font_family = JetBrainsMono Nerd Font
    font_size = 20
    color = rgba(255, 255, 255, 0.65)
    position = 0, 95
    halign = center
    valign = center
}

# ---- Campo de contrasena ---------------------------------------------------
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.30
    dots_center = true

    outer_color = rgba(255, 255, 255, 0.18)
    inner_color = rgba(0, 0, 0, 0.45)
    font_color = rgba(255, 255, 255, 0.95)
    check_color = rgba(255, 255, 255, 0.40)
    fail_color = rgba(220, 80, 80, 0.85)

    fade_on_empty = false
    placeholder_text = <i>Contrasena</i>
    fail_text = <i>Incorrecta ($ATTEMPTS)</i>

    rounding = 14
    position = 0, -40
    halign = center
    valign = center
}

# ---- Usuario ---------------------------------------------------------------
label {
    monitor =
    text = $USER
    font_family = JetBrainsMono Nerd Font
    font_size = 14
    color = rgba(255, 255, 255, 0.55)
    position = 30, -30
    halign = left
    valign = top
}
