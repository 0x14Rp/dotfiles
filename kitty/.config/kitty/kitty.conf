# Configuration for Kitty based on Wezterm config

# Colors and Theme
# Kitty uses 'include' for themes or sets colors directly.
# The 'rose-pine' theme is likely available for Kitty as a separate file.
# You would typically download the rose-pine theme file (often a .conf file)
# and include it like this:
# Or, you can define colors manually below if you have the color values.
# Example (replace with actual Rose Pine colors):
# background #191724
# foreground #e0def4
# cursor #e0def4
# ... other colors ...

# Cursor
cursor_shape underline
# Blinking is often the default for underline shape. If not, you might need
# to look into system-level settings or other Kitty options if available.

# Font
# Kitty uses font_family. For fallback, you might need to specify multiple
# families or rely on system fontconfig.
font_family JetBrainsMono Nerd Font
# You can list fallback fonts, but the mechanism is different from Wezterm:
# font_family CaskaydiaCove Nerd Font, FantasqueSansM Nerd Font
# Or disable fallback:
# disable_font_fallback yes

font_size 12.0

# Initial window size (in columns and rows)
initial_window_width 120
initial_window_height 30


# Window background opacity (0.0 to 1.0)
background_opacity 1.0

# Ocultar la barra de títulos fea por completo
hide_window_decorations yes

# Bordes delgados y estéticos
window_border_width 1px
active_border_color #ff7800
inactive_border_color #1f1d2e

# Confirm on OS window close
confirm_os_window_close 0


# Note: Window decorations are typically handled by the Wayland compositor
# or window manager (like Hyprland), not by Kitty's config directly.

# Confirm on OS window close
# Wezterm's 'AlwaysPrompt' is equivalent to 0 here.

# Scrollback lines
scrollback_lines 3000


# Windows padding
window_padding_width 10


# Inactive pane dimming
# Kitty uses inactive_text_alpha to dim text in inactive windows.
# It doesn't have direct HSB control for this in the same way as Wezterm.
# inactive_text_alpha 0.6 # Example: dim text by 40%

# Leader Key
# Kitty does NOT have a built-in leader key concept like Wezterm or Tmux.
# Keybindings are defined directly with modifiers.
# I will map the split/navigation actions to combinations like Ctrl+Shift+...
# or common Kitty defaults.

# Keybindings (mapped from your Wezterm LEADER keybindings)

# Split pane horizontally (right) - Equivalent to Wezterm LEADER+u
# Common Kitty horizontal split: Ctrl+Shift+D
map ctrl+shift+d create_sibling --vsplit

# Split pane vertically (bottom) - Equivalent to Wezterm LEADER+y
# Common Kitty vertical split: Ctrl+Shift+Enter
map ctrl+shift+enter create_window --no-cwd --no-session --allow-remote-control --keep-active-window --title @title

# Note: The exact behavior of splitting commands in Kitty can be nuanced.
# create_sibling --vsplit creates a split vertically (side-by-side).
# create_window creates a new window in the layout, which can result in a split.
# The keybindings below are common defaults or logical mappings.

# Navigate between panes - Mapped from Wezterm LEADER+h/j/k/l
# Common Kitty pane navigation: Ctrl+Alt + Arrow keys or Ctrl+Shift + Arrow keys
map ctrl+alt+h neighboring_window left
map ctrl+alt+j neighboring_window down
map ctrl+alt+k neighboring_window up
map ctrl+alt+l neighboring_window right

# Close the current pane - Equivalent to Wezterm LEADER+x
# Common Kitty close pane: Ctrl+D or Ctrl+Shift+W
map ctrl+shift+w close_window

# Status Bar
# Kitty's status bar is typically managed by external tools like Waybar or Polybar.
# The Lua scripting for the right-status in Wezterm is not directly transferable
# to Kitty's configuration file. You would configure your external status bar
# program to display information like battery status and username.

# Other settings from your Wezterm config that don't have direct Kitty equivalents in config:
# default_workspace = "home" # Kitty doesn't have built-in named workspaces like this.
# use_fancy_tab_bar = false # Tab bar appearance is controlled by other options or themes.
# status_update_interval = 1000 # Status bar updates are handled by external tools.
# tab_bar_at_bottom = true # Position of the tab bar is controlled by tab_bar_edge.
# tab_bar_edge bottom

# Example of tab bar edge at the bottom:
# tab_bar_edge bottom


# BEGIN_KITTY_THEME
# Rosé Pine
include current-theme.conf
# END_KITTY_THEME
